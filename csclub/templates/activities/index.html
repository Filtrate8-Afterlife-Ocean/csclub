{% extends "base.html" %}
{% block title %}
  Activities - CS Club
{% endblock %}
{% block body %}
    {% for activity in descriptions %}
        <div class="announcement">
            <div style="text-align: center;">
                <h1 >{{ activity.title }}</h1>
                <a href="{{ url_for(activity.endpoint) }}">Link</a>
            </div>
            <p class="message">{{ activity.description }}</p>
        </div>
    {% endfor %}
{% endblock %}
