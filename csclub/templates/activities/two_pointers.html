{% extends "base.html" %}
{% block title %}
    Two Pointers - CS Club
{% endblock %}
{% block body %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/activities.css') }}">

    <form id="completeForm" method="post" action="{{ url_for('activities.give_points') }}" hidden>
        {{ form.csrf_token }}
    </form>

    <div id="boxes" class="boxes"></div>


    <div class="button-row">
        <p class="button">
            <button type="button" id="moveLeftBtn">Move left pointer</button>
        </p>

        <p class="button">
            <button type="button" id="moveRightBtn">Move right pointer</button>
        </p>

        <p class="button">
            <button type="button" id="newPuzzleBtn">New puzzle</button>
        </p>   
    </div>

    <div class="text-row">
        <p><strong>Target: <span id="target"></span></strong></p>
        <p><strong>Current sum: <span id="sum"></span></strong></p>
    </div>

    <div class="text-row">
        <p><strong><span id="message"></span></strong></p>
    </div>




    <script defer src="/static/js/two_pointers.js"></script>
{% endblock %}
