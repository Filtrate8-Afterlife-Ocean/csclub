{% extends "base.html" %}
{% block title %}
  Announcements - CS Club
{% endblock %}
{% block body %}
    {% for announcement in messages %}
        <div class="container">
            <h1>{{ announcement.title }}</h1>
            <p>{{ announcement.message }}</p>
            <p>{{ announcement.date }}</p>
            {% if announcement.url is not none %}
                <iframe src="{{ announcement.url }}" width="800" height="450"></iframe>
            {% endif %}
        </div>
    {% endfor %}
{% endblock %}
