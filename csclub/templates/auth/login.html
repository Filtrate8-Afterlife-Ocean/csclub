{% from "_formhelpers.html" import render_field %}

{% extends "base.html" %}
{% block title %}
  Login - CS Club
{% endblock %}
{% block body %}
    <form method="post">
        <div>{{ form.csrf_token }}</div>
        
        {{ render_field(form.username )}}
        {{ render_field(form.password )}}

        <p class="button">
            <button type="submit">Login!</button>
        </p>
    </form>
{% endblock %}
