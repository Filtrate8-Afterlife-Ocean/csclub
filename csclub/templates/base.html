<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pico.min.css') }}">
    <title> {% block title %} CS Club {% endblock %} </title>
  </head>
  <body>
    <header class="container-fluid">
      <nav>
        
        <a href="{{ url_for('main.home') }}">CS Club</a>
        <ul>
          {# <li><a href="{{ url_for('main.home') }}">Home</a></li> #}
          <li><a href="{{ url_for('main.about') }}">About</a></li>
          <li><a href="{{ url_for('announcements.announcements') }}">Announcements</a></li>
        </ul>
      </nav>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <ul class=flashes>
          {% for message in messages %}
            <li>{{ message }}</li>
          {% endfor %}
          </ul>
        {% endif %}
      {% endwith %}
    </header>
    <main class="container-fluid">
      {% block body %}
      {% endblock %}
    </main>
  </body>
</html>
